[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-coach"
version = "0.1.0"
description = "Personal champ-select coach for League of Legends: pick, runes and build recommendations explained by Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lcu-driver>=3.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rift-coach = "rift_coach.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
